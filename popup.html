<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Answerly Inline</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Answerly Inline</h1>
      <label for="api-key">Deep Relay API key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Deep Relay key">
      <label for="model">Model</label>
      <select id="model">
        <option value="deeprelay/deepseek-v4.1-flash">DeepSeek V4.1 Flash 0910 (text)</option>
        <option value="deeprelay/kimi-k3">Kimi K3 (vision)</option>
        <option value="deeprelay/glm-5.3">GLM 5.3</option>
        <option value="deeprelay/glm-5.3-flash">GLM 5.3 Flash (vision)</option>
      </select>
      <label for="answer-instructions">Answer focus prompt</label>
      <textarea id="answer-instructions" rows="4" maxlength="2000" spellcheck="true"></textarea>
      <label for="answer-size">Answer text size <output id="answer-size-value" for="answer-size">60%</output></label>
      <input id="answer-size" type="range" min="40" max="100" step="5" value="60">
      <label for="answer-color">Answer text color</label>
      <label class="inline-toggle"><input id="match-question-color" type="checkbox" checked> Match question color</label>
      <input id="answer-color" type="color" value="#333333" aria-label="Custom answer text color" disabled>
      <h2>Study module files</h2>
      <div id="drop-zone" tabindex="0" role="button" aria-controls="study-files" aria-label="Attach study files by dropping or choosing files">
        <span>Drop PDF, DOCX, PPTX, TXT, or Markdown files here</span>
        <label class="choose-files" for="file-input">Choose files</label>
        <input id="file-input" type="file" accept=".pdf,.docx,.pptx,.txt,.md,.markdown" multiple hidden>
      </div>
      <p class="hint">Up to 10 files, 20 MB each, and 300,000 extracted characters per file. Scanned image-only PDFs may not contain extractable text.</p>
      <ul id="study-files" aria-label="Attached study files"></ul>
      <button id="clear-files" class="secondary" type="button" hidden>Clear all files</button>
      <p id="file-status" role="status" aria-live="polite"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="save" type="button">Save settings</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
